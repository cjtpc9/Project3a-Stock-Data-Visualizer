<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Data Visualizer</title>
</head>
<body>

    <h1>Stock Data Visualizer</h1>

    <form method="POST">

        <label for="symbol">Choose Symbol:</label>
        <select id="symbol" name="symbol" required>
            {% for symbol in symbols %}
                <option value="{{ symbol }}">{{ symbol }}</option>
            {% endfor %}
        </select>

        <br><br>

        <label for="chart_type">Choose Chart Type:</label>
        <select id="chart_type" name="chart_type" required>
            <option value="Bar">Bar</option>
            <option value="Line">Line</option>
        </select>

        <br><br>

        <label for="time_series">Choose Time Series:</label>
        <select id="time_series" name="time_series" required>
            <option value="Intraday">Intraday</option>
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
        </select>

        <br><br>

        <label for="start_date">Start Date:</label>
        <input
            type="date"
            id="start_date"
            name="start_date"
            required
        >

        <br><br>

        <label for="end_date">End Date:</label>
        <input
            type="date"
            id="end_date"
            name="end_date"
            required
        >

        <br><br>

        <button type="submit">Submit</button>

    </form>

    {% if error_message %}
        <p>{{ error_message }}</p>
    {% endif %}

    {% if chart_data %}
        <h2>Stock Chart</h2>

        <embed
            type="image/svg+xml"
            src="{{ chart_data }}"
            width="100%"
            height="600"
        >
    {% endif %}

</body>
</html>
